<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Super zoo nápovědník</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <style>
    #scrollTopBtn {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 9999;
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 50%;
      background: #ffcc00;
      cursor: pointer;
      box-shadow: 1px 1px 5px rgba(0,0,0,0.3);
      justify-content: center;
      align-items: center;
      padding: 0;
    }
    #ean-logo {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #ean-logo img { -webkit-user-drag: none; user-drag: none; }
  </style>
</head>
<body>
<header>
  <div class="header-content">
    <h1>Super zoo nápovědník</h1>
    <div class="logo-wrapper">
      <div class="logo-flip" id="ean-logo" title="Podržte 3 sekundy pro Režim EAN">
        <div class="logo-front">
          <img src="logo.png" alt="Super zoo logo" class="logo" draggable="false" />
        </div>
        <div class="logo-back">Režim EAN</div>
      </div>
    </div>
  </div>
</header>

<div id="store-selector" style="margin-bottom: 15px;">
  <label for="store-id">Číslo prodejny</label>
  <input type="text" id="store-id" placeholder="Zadejte číslo prodejny" />
  <button id="save-store-id">Uložit</button>
  <div id="store-message" style="color: green; margin-top: 5px;"></div>
</div>

<div class="search-and-filter">
  <label style="margin-right: 10px;">
    <input type="checkbox" id="filter-instock" />
    Pouze skladem
  </label>
  <input type="text" id="search" placeholder="Vyhledat..." />
</div>

<div id="categories"></div>
<div id="container"></div>

<button id="scrollTopBtn" title="Nahoru">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="42" height="42" fill="#5c3b00">
    <path d="M12 4L6 10h4v6h4v-6h4z" />
  </svg>
</button>

<script src="script.js"></script>
<script>
  // Inventura: podržet logo alespoň 3 sekundy a pak pustit.
  // window.open se volá přímo v pointerup, aby jej prohlížeč neblokoval.
  const eanLogo = document.getElementById("ean-logo");
  let holdStart = null;
  let activePointer = null;

  eanLogo.addEventListener("pointerdown", (event) => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    holdStart = performance.now();
    activePointer = event.pointerId;
    if (event.pointerType === "touch") event.preventDefault();
  });

  eanLogo.addEventListener("pointerup", (event) => {
    if (activePointer !== event.pointerId || holdStart === null) return;
    const duration = performance.now() - holdStart;
    holdStart = null;
    activePointer = null;
    if (duration >= 3000) {
      window.open("https://xchipsy.github.io/SZNean/", "_blank", "noopener");
    }
  });

  function cancelHold() { holdStart = null; activePointer = null; }
  eanLogo.addEventListener("pointercancel", cancelHold);
  eanLogo.addEventListener("pointerleave", cancelHold);
  eanLogo.addEventListener("contextmenu", (event) => event.preventDefault());
  eanLogo.addEventListener("dragstart", (event) => event.preventDefault());

  const scrollTopBtn = document.getElementById("scrollTopBtn");
  window.addEventListener("scroll", () => {
    scrollTopBtn.style.display = window.scrollY > 300 ? "flex" : "none";
  });
  scrollTopBtn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  document.addEventListener("DOMContentLoaded", () => {
    const filterCheckbox = document.getElementById("filter-instock");
    const savedState = localStorage.getItem("filterInStockChecked");
    filterCheckbox.checked = savedState === null ? true : savedState === "true";
    filterCheckbox.addEventListener("change", () => {
      localStorage.setItem("filterInStockChecked", filterCheckbox.checked);
    });
    filterCheckbox.dispatchEvent(new Event("change"));
  });
</script>
</body>
</html>
