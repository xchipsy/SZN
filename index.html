<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Super zoo nápovědník</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

  <style>
    #scrollTopBtn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 9999;
      width: 60px;
      height: 60px;
      border: none;
      border-radius: 50%;
      background: #ffcc00;
      cursor: pointer;
      box-shadow: 1px 1px 5px rgba(0,0,0,0.3);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 0;
    }
    #ean-logo {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #ean-logo img { -webkit-user-drag: none; }
  </style>
</head>
<body>

<header>
  <div class="header-content">
    <h1>Super zoo nápovědník</h1>
    <div class="logo-wrapper">
      <div class="logo-flip" id="ean-logo" title="Podržte 3 sekundy pro Režim EAN">
        <div class="logo-front">
          <img src="logo.png" alt="Super zoo logo" class="logo" draggable="false" />
        </div>
        <div class="logo-back">Režim EAN</div>
      </div>
    </div>
  </div>
</header>

<div id="store-selector" style="margin-bottom: 15px;">
  <label for="store-id">Číslo prodejny</label>
  <input type="text" id="store-id" placeholder="Zadejte číslo prodejny" />
  <button id="save-store-id">Uložit</button>
  <div id="store-message" style="color: green; margin-top: 5px;"></div>
</div>

<div class="search-and-filter">
  <label style="margin-right: 10px;">
    <input type="checkbox" id="filter-instock" />
    Pouze skladem
  </label>
  <input type="text" id="search" placeholder="Vyhledat..." />
</div>

<div id="categories"></div>
<div id="container"></div>

<button id="scrollTopBtn" title="Nahoru">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="42" height="42" fill="#5c3b00">
    <path d="M12 4L6 10h4v6h4v-6h4z" />
  </svg>
</button>

<script src="script.js"></script>

<script>
  // Tlačítko pro návrat nahoru
  const scrollTopBtn = document.getElementById("scrollTopBtn");
  window.addEventListener("scroll", () => {
    scrollTopBtn.style.display = window.scrollY > 300 ? "flex" : "none";
  });
  scrollTopBtn.addEventListener("click", () => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // Filtr "Pouze skladem" – výchozí zapnutý, stav se pamatuje
  document.addEventListener("DOMContentLoaded", () => {
    const filterCheckbox = document.getElementById("filter-instock");
    const savedState = localStorage.getItem("filterInStockChecked");
    filterCheckbox.checked = savedState === null ? true : savedState === "true";
    filterCheckbox.addEventListener("change", () => {
      localStorage.setItem("filterInStockChecked", filterCheckbox.checked);
    });
    filterCheckbox.dispatchEvent(new Event("change"));
  });

  // Inventura: otevře se v nové záložce po podržení loga 3 s
  // a následném uvolnění prstu / tlačítka myši.
  const eanLogo = document.getElementById("ean-logo");
  const EAN_URL = "https://xchipsy.github.io/SZNean/";
  let holdTimer = null;
  let holdingPointerId = null;
  let holdReady = false;

  function resetHold() {
    clearTimeout(holdTimer);
    holdTimer = null;
    holdingPointerId = null;
    holdReady = false;
  }

  eanLogo.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || holdingPointerId !== null) return;
    event.preventDefault();
    holdingPointerId = event.pointerId;
    holdReady = false;
    holdTimer = setTimeout(() => {
      holdReady = true;
    }, 3000);
  });

  eanLogo.addEventListener("pointerup", (event) => {
    if (event.pointerId !== holdingPointerId) return;
    const shouldOpen = holdReady;
    resetHold();
    // Volání přímo při uvolnění je uživatelské gesto, takže nová
    // záložka nebude blokovaná jako při window.open v setTimeout.
    if (shouldOpen) window.open(EAN_URL, "_blank");
  });

  eanLogo.addEventListener("pointercancel", (event) => {
    if (event.pointerId === holdingPointerId) resetHold();
  });
  eanLogo.addEventListener("pointerleave", (event) => {
    if (event.pointerId === holdingPointerId) resetHold();
  });
  eanLogo.addEventListener("contextmenu", (event) => event.preventDefault());
  eanLogo.addEventListener("click", (event) => event.preventDefault());

</script>

</body>
</html>
